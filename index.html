<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA DDR – Shooter VR</title>
<style>
html,body{margin:0;height:100%;background:#0b0f1a;color:#e8ecf8;font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
canvas{display:block}
#s{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(#0b0f1a,#1c2440);text-align:center;padding:24px}
h1{margin:0;font-size:34px;letter-spacing:2px}
p{margin:0;opacity:.8;max-width:560px}
button{font-size:22px;padding:16px 34px;border-radius:12px;border:0;background:#f0b020;color:#1a1204;font-weight:700;cursor:pointer}
button.z{background:#39426a;color:#e8ecf8;font-size:16px;padding:10px 20px}
button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div id="s">
  <h1>GTA DDR – Shooter VR</h1>
  <p id="m">Lade Stadt …</p>
  <button id="b" disabled>In VR starten</button>
  <button id="z" class="z" disabled>Ohne Brille ansehen</button>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
